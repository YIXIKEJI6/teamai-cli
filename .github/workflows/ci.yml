name: Central infrastructure
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: central-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build exact source and run required regression tests
        timeout-minutes: 8
        run: |
          set -eu
          docker build --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" --iidfile /tmp/teamai-image-id .
      - name: Real container authentication and persistence acceptance
        timeout-minutes: 2
        run: |
          set -eu
          mkdir -p evidence
          export TEAMAI_CENTRAL_IMAGE="$(cat /tmp/teamai-image-id)"
          node scripts/central-e2e.mjs docker > evidence/container-e2e.json
          docker image inspect "$TEAMAI_CENTRAL_IMAGE" --format '{{json .Config.Labels}}' > evidence/image-source.json
          cp /tmp/teamai-image-id evidence/image-id.txt
      - name: Preserve acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: central-container-evidence
          path: evidence/
          if-no-files-found: error
